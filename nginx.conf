server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # /about -> about.html, /blog/x -> blog/x.html (same URLs as the Framer site).
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Framer's runtime is ES modules; older mime.types lack .mjs. (A `types {}`
    # block here would replace the whole MIME table, so use default_type.)
    location ~ \.mjs$ {
        default_type application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Mirrored Framer assets and Next.js chunks have content-hashed names.
    location ~ ^/(_fr|_next)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    error_page 404 /404.html;
}
