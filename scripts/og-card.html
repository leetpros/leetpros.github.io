<!doctype html>
<!-- Source for the link-preview pictures in public/lp/og-*.png.
     Open with #erpnext or #home on the local preview and screenshot at 1200x630. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/lp/site.css">
<style>
  body { width: 1200px; height: 630px; overflow: hidden; display: grid; grid-template-columns: 1fr; background: #f6f7f9; position: relative; }
  body::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(18, 20, 25, 0.08) 1px, transparent 1.2px); background-size: 22px 22px; -webkit-mask-image: radial-gradient(70% 80% at 30% 40%, #000, transparent); mask-image: radial-gradient(70% 80% at 30% 40%, #000, transparent); }
  .og { position: relative; padding: 64px 72px; display: grid; align-content: space-between; }
  .og__top { display: flex; align-items: center; justify-content: space-between; }
  .og__logo { height: 44px; padding: 10px 22px 10px 12px; background: #2a2c32; border-radius: 99px; box-sizing: content-box; }
  .og h1 { font-family: var(--display); font-weight: 700; font-size: 84px; line-height: 1.02; letter-spacing: -0.055em; }
  .og h1 em { font-style: normal; color: var(--soft); }
  .og p { font-size: 27px; line-height: 1.4; color: var(--body); max-width: 760px; letter-spacing: -0.02em; margin-top: 22px; }
  .og__chips { display: flex; gap: 12px; }
  .og__chips span { height: 48px; padding: 0 20px; display: inline-flex; align-items: center; background: #fff; border-radius: 99px; box-shadow: var(--shadow); font-size: 19px; font-weight: 500; }
  .og__url { font-size: 21px; font-weight: 600; color: var(--ink); }
</style>
</head>
<body>
<div class="og">
  <div class="og__top"><img class="og__logo" src="/lp/logo-white.svg" alt=""><span class="og__url" id="url"></span></div>
  <div><h1 id="h"></h1><p id="p"></p></div>
  <div class="og__chips" id="chips"></div>
</div>
<script>
  const cards = {
    erpnext: { url: "leetpros.com/erpnext", h: "Stop renting<br><em>your own ERP.</em>", p: "Leave your ERPNext reseller and keep your system: same screens, same data, unlimited users.", chips: ["Fixed fee", "Verified on staging first", "No per-user fees"] },
    home: { url: "leetpros.com", h: "ERPNext, set up properly.<br><em>Owned by you.</em>", p: "Implementation, migration and support, on a site your company owns.", chips: ["Implementation", "Migration", "Support"] },
  };
  const card = cards[new URLSearchParams(location.search).get("t") || location.hash.slice(1)] || cards.home;
  document.getElementById("url").textContent = card.url;
  document.getElementById("h").innerHTML = card.h;
  document.getElementById("p").textContent = card.p;
  document.getElementById("chips").innerHTML = card.chips.map((c) => "<span>" + c + "</span>").join("");
</script>
</body>
</html>
